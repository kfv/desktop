# Shall be included from /etc/make.conf.
#
# Each port picks up only its own patch.  += keeps any patches the port's
# own options add.

_DESKTOP:=	${.PARSEDIR}

# The suckless fibonacci patch, as published: a git diff, so -p1.  It goes
# first; dwm.diff is made against config.def.h with it applied.
.if ${.CURDIR:M*/x11-wm/dwm}
EXTRA_PATCHES+=	${_DESKTOP}/patches/dwm-fibonacci.diff:-p1
.endif

.for _port _name in \
    x11-wm/dwm dwm \
    x11/sterm st \
    x11/dmenu dmenu \
    x11/slock slock \
    x11/slstatus slstatus \
    x11/xdm xdm
.if ${.CURDIR:M*/${_port}}
EXTRA_PATCHES+=	${_DESKTOP}/patches/${_name}.diff
.endif
.endfor

# Every option of these ports is named here, so the build never stops at
# an options dialog.  The _FORCE ones hold even over choices saved with
# `make config': the suckless ones patch config.def.h and would clash
# with ours, and the greeter theme needs xdm built with Xft.
x11-wm_dwm_SET=			DMENUANDSTERM DOCS XINERAMA
x11-wm_dwm_UNSET_FORCE=		SUPERASMODKEY VOLUMECONTROL
x11_sterm_SET=			DOCS
x11_sterm_UNSET_FORCE=		SCROLLBACK XRESOURCES
x11_dmenu_SET=			XINERAMA
x11_slstatus_SET=		DOCS
x11_xdm_SET_FORCE=		XFT
x11_xdm_UNSET=			XDMSHELL
